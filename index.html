
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c131f">
  <meta name="description" content="iSano — mobilny serwis urządzeń Apple na Śląsku. Nasza nowa strona już wkrótce.">
  <title>iSano — Już wkrótce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c131f;
      --surface: #122033;
      --border: #26374b;
      --text: #e5ebf5;
      --muted: #91a0b4;
      --blue: #66adff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .glow {
      position: absolute;
      z-index: -1;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(
        ellipse,
        rgba(55, 135, 231, .16) 0%,
        transparent 70%
      );
      pointer-events: none;
    }

    header {
      width: 100%;
      padding: 25px max(6%, calc((100% - 1200px)/2));
      border-bottom: 1px solid rgba(255,255,255,.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      width: 110px;
      height: auto;
      display: block;
    }

    .header-pill {
      padding: 10px 18px;
      border: 1px solid #30425a;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      color: #b9d9ff;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 90px 24px 110px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a7d2ff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--blue);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--blue);
      animation: pulse 2.5s infinite;
    }

    h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1.08;
      letter-spacing: -0.055em;
      font-weight: 800;
      margin: 0;
    }

    .gradient {
      background: linear-gradient(90deg, #438ff1, #91caff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .description {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
      max-width: 440px;
      margin: 26px 0 0;
    }

    .status {
      margin-top: 44px;
      padding: 17px 22px;
      display: flex;
      align-items: center;
      gap: 15px;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(18,32,51,.85);
      backdrop-filter: blur(12px);
    }

    .status-icon {
      color: #80beff;
      font-size: 25px;
    }

    .status strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
    }

    .status span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,.07);
      padding: 24px max(6%, calc((100% - 1200px)/2));
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #718198;
      font-size: 11px;
    }

    @keyframes pulse {
      50% { opacity: .4; box-shadow: 0 0 4px var(--blue); }
    }

    @media (max-width: 600px) {
      header { padding: 22px 24px; }
      .logo { width: 95px; }
      .header-pill { font-size: 10px; padding: 9px 13px; }
      .eyebrow { font-size: 9px; letter-spacing: 1.2px; }
      .description { font-size: 14px; }
      footer {
        padding: 24px;
        flex-direction: column;
        text-align: center;
        align-items: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="glow"></div>

    <header>
      <img src="media/logo-isano.png" alt="iSano" class="logo">

    </header>

    <main>
      <div class="eyebrow">
        <span class="dot"></span>
        Mobilny serwis urządzeń Apple
      </div>

      <h1>
        Coś dobrego<br>
        <span class="gradient">nadchodzi.</span>
      </h1>

      <p class="description">
        Pracujemy nad nową stroną iSano.<br>
        Już wkrótce wygodnie zamówisz naprawę
        swojego urządzenia Apple.
      </p>

      <div class="status">
        <div class="status-icon">✧</div>
        <div>
          <strong>Strona w przygotowaniu</strong>
          <span>Dopracowujemy ostatnie szczegóły.</span>
        </div>
      </div>
    </main>

    <footer>
      <span>© 2026 iSano. Wszystkie prawa zastrzeżone.</span>
    </footer>
  </div>
</body>
</html>
